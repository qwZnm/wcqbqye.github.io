<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 编解码 · 工具箱</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <a class="back-btn" id="backBtn" href="index.html" style="display:flex;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    返回首页
  </a>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    <span>工具箱</span>
  </div>
  <div class="header-actions" style="margin-left:auto;">
    <button class="icon-btn" onclick="toggleTheme()" title="切换主题"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    <button class="login-btn" id="loginBtn" onclick="openModal()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>登录</button>
    <div class="user-menu" id="userMenu"><div class="user-avatar" id="userAvatar">U</div><span class="user-name" id="userName">用户</span><button class="logout-btn" onclick="logout()">退出</button></div>
  </div>
</header>

<!-- Tool View -->
<div id="toolView" style="display:block;">
  <div class="tool-header">
    <div class="tool-header-row">
      <div class="tool-title"><div class="tool-title-icon">🔠</div><span>Base64 编解码</span></div>
      <a class="python-download-btn" href="python/base64_tool.py" download="base64_tool.py">Python版下载</a>
    </div>
    <div class="tool-subtitle">支持文本编解码与文件编解码 · UTF-8 安全 · 中文无乱码 · 本地处理不上传</div>
  </div>
  <div class="tool-body">
    <div class="tool-tabs">
      <button class="tool-tab active" onclick="switchToolTab('b64-text', this)">文本编解码</button>
      <button class="tool-tab" onclick="switchToolTab('b64-file', this)">文件编解码</button>
    </div>
    <!-- Text Panel -->
    <div class="panel active" id="b64-text">
      <textarea class="text-input" id="b64Input" placeholder="输入文本或 Base64 字符串..." oninput="b64AutoDetect()"></textarea>
      <div class="arrow-row">
        <button class="arrow-btn" onclick="b64Encode()">↓ 编码为 Base64</button>
        <button class="arrow-btn" onclick="b64Decode()" style="background:var(--card-bg);color:var(--primary);border:1px solid var(--primary);">↑ 解码为文本</button>
      </div>
      <textarea class="text-output" id="b64Output" placeholder="结果将显示在这里..." readonly></textarea>
      <div class="arrow-row" style="justify-content:flex-end;">
        <button class="action-btn" onclick="b64Copy()">📋 复制结果</button>
        <button class="action-btn" onclick="b64Swap()">⇅ 交换</button>
        <button class="action-btn" onclick="b64Clear()">✕ 清空</button>
      </div>
    </div>
    <!-- File Panel -->
    <div class="panel" id="b64-file">
      <div class="drop-zone" id="b64DropZone" onclick="document.getElementById('b64FileInput').click()">
        <div class="drop-zone-icon">📎</div>
        <div class="drop-zone-text">点击选择文件 或 拖拽文件到此处</div>
        <div class="drop-zone-hint">支持任意格式文件 · 最大 10MB · 本地处理不上传</div>
        <input type="file" id="b64FileInput" style="display:none" onchange="b64HandleFile(this.files[0])">
      </div>
      <div class="file-info" id="b64FileInfo">
        <div class="file-info-row"><span class="file-info-label">文件名</span><span class="file-info-value" id="b64FileName">-</span></div>
        <div class="file-info-row"><span class="file-info-label">大小</span><span class="file-info-value" id="b64FileSize">-</span></div>
        <div class="file-info-row"><span class="file-info-label">类型</span><span class="file-info-value" id="b64FileType">-</span></div>
        <div class="file-info-row"><span class="file-info-label">检测</span><span class="file-info-value" id="b64FileDetect">-</span></div>
      </div>
      <div class="progress-bar" id="b64Progress"><div class="progress-fill" id="b64ProgressFill" style="width:0%"></div></div>
      <div class="arrow-row">
        <button class="arrow-btn" onclick="b64EncodeFile()">↓ 文件编码为 Base64</button>
        <button class="arrow-btn" onclick="b64DecodeFile()" style="background:var(--card-bg);color:var(--primary);border:1px solid var(--primary);">↑ Base64 解码为文件</button>
      </div>
      <div class="result-box" id="b64FileResult">
        <div class="result-header">
          <span class="result-title" id="b64ResultTitle">结果</span>
          <div class="result-actions">
            <button class="action-btn" onclick="b64DownloadResult()">💾 下载</button>
            <button class="action-btn" onclick="b64CopyResult()">📋 复制</button>
          </div>
        </div>
        <textarea class="text-output" id="b64FileOutput" placeholder="结果..." readonly style="min-height:100px;"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer"><p>工具箱 · Base64 编解码 · 所有数据均在浏览器本地处理</p></footer>

<!-- Login Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-header"><div class="logo-icon">🧰</div><h2 id="modalTitle">欢迎回来</h2><p id="modalSub">登录以同步你的工具收藏</p></div>
    <div class="tab-switch"><button class="active" id="loginTab" onclick="switchTab('login')">登录</button><button id="registerTab" onclick="switchTab('register')">注册</button></div>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group register-fields" id="regNameField"><label>用户名</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="regName" placeholder="请输入用户名"></div></div>
      <div class="form-group"><label>邮箱 / 用户名</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><input type="text" id="emailInput" placeholder="请输入邮箱或用户名"></div></div>
      <div class="form-group"><label>密码</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="passwordInput" placeholder="请输入密码"></div></div>
      <div class="form-group register-fields" id="regConfirmField"><label>确认密码</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="regConfirm" placeholder="请再次输入密码"></div></div>
      <div class="error-msg" id="errorMsg"></div>
      <div class="form-row" id="formRow"><label class="checkbox-wrap"><input type="checkbox" id="rememberMe"> 记住我</label><button type="button" class="link-btn" onclick="showToast('请联系管理员重置密码')">忘记密码？</button></div>
      <button type="submit" class="submit-btn" id="submitBtn">登 录</button>
    </form>
    <div class="divider">其他方式</div>
    <div class="social-login"><button class="social-btn" onclick="socialLogin('GitHub')" title="GitHub">🐙</button><button class="social-btn" onclick="socialLogin('Google')" title="Google">🔵</button><button class="social-btn" onclick="socialLogin('微信')" title="微信">💬</button></div>
    <div class="modal-footer"><span id="footerText">还没有账号？</span><a onclick="switchTab('register')">立即注册</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/base64.js"></script>
</body>
</html>
