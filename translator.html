<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线翻译 · 工具箱</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a class="back-btn" href="index.html" style="display:flex;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    返回首页
  </a>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    <span>工具箱</span>
  </div>
  <div class="header-actions" style="margin-left:auto;">
    <button class="icon-btn" onclick="toggleTheme()" title="切换主题"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
</header>

<div id="toolView" style="display:block;">
  <div class="tool-header">
    <div class="tool-header-row">
      <div class="tool-title"><div class="tool-title-icon">🌐</div><span>在线翻译</span></div>
      <a class="python-download-btn" href="python/translator.py" download="translator.py">Python版下载</a>
    </div>
    <div class="tool-subtitle">自动识别中英文 · 支持中英互译 · 可复制结果</div>
  </div>
  <div class="tool-body">
    <div class="translator-wrap">
      <div class="translator-toolbar">
        <select id="transSourceLang" class="translator-select" onchange="onLangChange()">
          <option value="auto">自动识别</option>
          <option value="zh-CN">中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
        </select>
        <button class="translator-swap" onclick="swapTranslateLangs()" title="交换语言">⇄</button>
        <select id="transTargetLang" class="translator-select" onchange="scheduleTranslate()">
          <option value="en">英文</option>
          <option value="zh-CN">中文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
        </select>
      </div>
      <div class="translator-grid">
        <div class="translator-panel">
          <div class="translator-panel-head">
            <span>原文</span>
            <button class="link-btn" onclick="clearTranslator()">清空</button>
          </div>
          <textarea id="transInput" class="translator-textarea" placeholder="输入要翻译的文本，例如：你好 / hello" oninput="onInputChange()"></textarea>
          <div class="translator-hint" id="transHint">实时翻译 · 输入即翻译</div>
        </div>
        <div class="translator-panel">
          <div class="translator-panel-head">
            <span>译文</span>
            <button class="link-btn" onclick="copyTranslation()">复制结果</button>
          </div>
          <textarea id="transOutput" class="translator-textarea translator-output" placeholder="翻译结果会实时显示在这里" readonly></textarea>
          <div class="translator-hint" id="transStatus">等待输入...</div>
        </div>
      </div>
      <div class="translator-actions">
        <button class="action-btn" onclick="fillTranslateDemo()">填入示例</button>
      </div>
      <div class="translator-note">
        实时翻译 · 输入即翻译 · 在线接口不可用时自动切换本地词典。命令行版已放在 <code>python/translator.py</code>。
      </div>
    </div>
  </div>
</div>

<footer class="footer"><p>工具箱 · 在线翻译</p></footer>
<div class="toast" id="toast"></div>

<script src="js/translator.js?v=20260805-realtime"></script>
</body>
</html>
