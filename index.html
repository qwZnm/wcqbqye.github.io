<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱 · 精选在线工具</title>
<style>
:root {
  --bg: #f5f6f8;
  --card-bg: #ffffff;
  --text: #1a1a2e;
  --text-sub: #8b8fa3;
  --primary: #5b5fe8;
  --primary-light: #7c80f0;
  --primary-dark: #4548d4;
  --border: #eceef2;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --shadow-hover: 0 6px 20px rgba(91,95,232,.12);
  --radius: 14px;
  --header-h: 60px;
}
[data-theme="dark"] {
  --bg: #0d1117;
  --card-bg: #161b22;
  --text: #e6edf3;
  --text-sub: #7d8590;
  --primary: #7c80f0;
  --primary-light: #9ca0f5;
  --primary-dark: #5b5fe8;
  --border: #21262d;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-hover: 0 6px 20px rgba(124,128,240,.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .3s, color .3s;
  min-height: 100vh;
}
/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  height: var(--header-h);
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 32px; gap: 20px;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 19px; font-weight: 700; color: var(--primary);
  white-space: nowrap; cursor: pointer;
}
.logo svg { width: 26px; height: 26px; }
.search-box {
  flex: 1; max-width: 360px; position: relative;
}
.search-box input {
  width: 100%; height: 38px; padding: 0 16px 0 38px;
  border: 1px solid var(--border); border-radius: 19px;
  background: var(--bg); color: var(--text); font-size: 13px;
  outline: none; transition: border-color .2s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box svg {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--text-sub);
}
.header-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.icon-btn {
  width: 38px; height: 38px; border: none; border-radius: 50%;
  background: var(--bg); color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
}
.icon-btn:hover { background: var(--border); }
.icon-btn svg { width: 18px; height: 18px; }
.login-btn {
  height: 38px; padding: 0 18px; border: none; border-radius: 19px;
  background: var(--primary); color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .2s; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.login-btn:hover { background: var(--primary-dark); }
.user-menu { display: none; align-items: center; gap: 8px; }
.user-menu.show { display: flex; }
.user-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
}
.user-name { font-size: 13px; font-weight: 500; }
.logout-btn {
  height: 30px; padding: 0 12px; border: 1px solid var(--border);
  border-radius: 15px; background: transparent; color: var(--text-sub);
  font-size: 12px; cursor: pointer; transition: all .2s;
}
.logout-btn:hover { border-color: var(--primary); color: var(--primary); }

/* Hero */
.hero {
  text-align: center; padding: 48px 20px 32px;
}
.hero h1 {
  font-size: 28px; font-weight: 800; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p { font-size: 14px; color: var(--text-sub); }

/* Main */
.main { padding: 0 32px 40px; max-width: 960px; margin: 0 auto; }
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}
.tool-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  cursor: pointer; transition: all .25s;
  display: flex; flex-direction: column; gap: 10px;
  text-decoration: none; color: inherit;
}
.tool-card:hover {
  border-color: var(--primary); box-shadow: var(--shadow-hover);
  transform: translateY(-3px);
}
.tool-icon {
  width: 42px; height: 42px; border-radius: 11px;
  background: linear-gradient(135deg, var(--primary-light), var(--primary));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.tool-name { font-size: 14px; font-weight: 600; }
.tool-desc { font-size: 12px; color: var(--text-sub); line-height: 1.5; }
.no-result {
  text-align: center; padding: 60px 20px; color: var(--text-sub);
  font-size: 15px;
}

/* Login Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .25s;
}
.modal-overlay.show { display: flex; opacity: 1; }
.modal {
  background: var(--card-bg); border-radius: 20px;
  width: 380px; max-width: 90vw; padding: 32px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  transform: scale(.95); transition: transform .25s;
  position: relative;
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-close {
  position: absolute; top: 14px; right: 18px;
  background: none; border: none; font-size: 22px;
  color: var(--text-sub); cursor: pointer; line-height: 1;
}
.modal-header { text-align: center; margin-bottom: 24px; }
.modal-header .logo-icon {
  width: 52px; height: 52px; margin: 0 auto 10px;
  background: linear-gradient(135deg, var(--primary-light), var(--primary));
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}
.modal-header h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.modal-header p { font-size: 13px; color: var(--text-sub); }
.tab-switch {
  display: flex; gap: 0; margin-bottom: 20px;
  background: var(--bg); border-radius: 10px; padding: 3px;
}
.tab-switch button {
  flex: 1; padding: 9px; border: none; border-radius: 8px;
  background: transparent; color: var(--text-sub); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: all .2s;
}
.tab-switch button.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow); }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 500;
  margin-bottom: 5px; color: var(--text);
}
.input-wrap { position: relative; }
.input-wrap input {
  width: 100%; height: 42px; padding: 0 14px 0 38px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); color: var(--text); font-size: 13px;
  outline: none; transition: border-color .2s;
}
.input-wrap input:focus { border-color: var(--primary); }
.input-wrap svg {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-sub);
}
.form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.checkbox-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub); cursor: pointer; }
.checkbox-wrap input { width: 15px; height: 15px; accent-color: var(--primary); }
.link-btn { background: none; border: none; color: var(--primary); font-size: 12px; cursor: pointer; }
.submit-btn {
  width: 100%; height: 44px; border: none; border-radius: 10px;
  background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background .2s;
}
.submit-btn:hover { background: var(--primary-dark); }
.modal-footer { text-align: center; margin-top: 18px; font-size: 12px; color: var(--text-sub); }
.modal-footer a { color: var(--primary); text-decoration: none; cursor: pointer; }
.divider { text-align: center; margin: 18px 0; font-size: 12px; color: var(--text-sub); position: relative; }
.divider::before, .divider::after {
  content: ''; position: absolute; top: 50%; width: 35%; height: 1px; background: var(--border);
}
.divider::before { left: 0; }
.divider::after { right: 0; }
.social-login { display: flex; gap: 12px; justify-content: center; }
.social-btn {
  width: 42px; height: 42px; border: 1px solid var(--border); border-radius: 50%;
  background: var(--bg); cursor: pointer; display: flex;
  align-items: center; justify-content: center; font-size: 18px; transition: all .2s;
}
.social-btn:hover { border-color: var(--primary); }
.register-fields { display: none; }
.register-fields.show { display: block; }
.error-msg {
  color: #ef4444; font-size: 12px; margin-top: 6px; display: none;
}
.error-msg.show { display: block; }

/* Footer */
.footer {
  text-align: center; padding: 30px 20px; color: var(--text-sub);
  font-size: 12px; border-top: 1px solid var(--border);
}
/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--text); color: var(--card-bg);
  padding: 10px 22px; border-radius: 10px; font-size: 13px;
  z-index: 2000; transition: transform .3s; box-shadow: 0 4px 20px rgba(0,0,0,.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 640px) {
  .header { padding: 0 14px; gap: 10px; }
  .logo span { display: none; }
  .search-box { max-width: none; }
  .main { padding: 0 14px 30px; }
  .tools-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tool-card { padding: 16px; }
  .user-name { display: none; }
  .hero { padding: 32px 16px 24px; }
  .hero h1 { font-size: 22px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo" onclick="scrollToTop()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    <span>工具箱</span>
  </div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="搜索工具..." oninput="filterTools()">
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()" title="切换主题">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>
    <button class="login-btn" id="loginBtn" onclick="openModal()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      登录
    </button>
    <div class="user-menu" id="userMenu">
      <div class="user-avatar" id="userAvatar">U</div>
      <span class="user-name" id="userName">用户</span>
      <button class="logout-btn" onclick="logout()">退出</button>
    </div>
  </div>
</header>

<!-- Hero -->
<section class="hero">
  <h1>精选工具集合</h1>
  <p>10 个最常用的在线工具 · 浏览器本地运行 · 数据不上传</p>
</section>

<!-- Main -->
<main class="main">
  <div class="tools-grid" id="toolsGrid"></div>
  <div class="no-result" id="noResult" style="display:none;">没有找到相关工具</div>
</main>

<!-- Footer -->
<footer class="footer">
  <p>工具箱 · 精选在线工具 · 所有数据均在浏览器本地处理</p>
</footer>

<!-- Login Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-header">
      <div class="logo-icon">🧰</div>
      <h2 id="modalTitle">欢迎回来</h2>
      <p id="modalSub">登录以同步你的工具收藏</p>
    </div>
    <div class="tab-switch">
      <button class="active" id="loginTab" onclick="switchTab('login')">登录</button>
      <button id="registerTab" onclick="switchTab('register')">注册</button>
    </div>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group register-fields" id="regNameField">
        <label>用户名</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="regName" placeholder="请输入用户名">
        </div>
      </div>
      <div class="form-group">
        <label>邮箱 / 用户名</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="text" id="emailInput" placeholder="请输入邮箱或用户名">
        </div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="passwordInput" placeholder="请输入密码">
        </div>
      </div>
      <div class="form-group register-fields" id="regConfirmField">
        <label>确认密码</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="regConfirm" placeholder="请再次输入密码">
        </div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <div class="form-row" id="formRow">
        <label class="checkbox-wrap">
          <input type="checkbox" id="rememberMe"> 记住我
        </label>
        <button type="button" class="link-btn" onclick="showToast('请联系管理员重置密码')">忘记密码？</button>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">登 录</button>
    </form>
    <div class="divider">其他方式</div>
    <div class="social-login">
      <button class="social-btn" onclick="socialLogin('GitHub')" title="GitHub">🐙</button>
      <button class="social-btn" onclick="socialLogin('Google')" title="Google">🔵</button>
      <button class="social-btn" onclick="socialLogin('微信')" title="微信">💬</button>
    </div>
    <div class="modal-footer">
      <span id="footerText">还没有账号？</span>
      <a onclick="switchTab('register')">立即注册</a>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== 10 精选工具 =====
const tools = [
  { icon:'{}', name:'JSON 格式化', desc:'语法高亮 · 格式化/压缩 · JSONPath 查询' },
  { icon:'🔎', name:'正则测试', desc:'实时高亮 · 分组捕获 · 标志位' },
  { icon:'🔠', name:'Base64 编解码', desc:'文本 ↔ Base64 · UTF-8 安全 · 中文无乱码' },
  { icon:'▣', name:'二维码生成', desc:'文本/网址/WiFi · Logo/渐变 · PNG/SVG' },
  { icon:'🗜️', name:'图片压缩', desc:'批量压缩 · JPG/PNG/WebP/AVIF' },
  { icon:'📑', name:'PDF 合并', desc:'多个 PDF · 拖拽排序 · 本地处理' },
  { icon:'🔐', name:'密码生成', desc:'强度评级 · 排除易混淆 · 历史记录' },
  { icon:'🕤', name:'时间戳转换', desc:'秒/毫秒互转 · 多时区切换' },
  { icon:'🧮', name:'计算器', desc:'基础 + 科学函数 · 百分比/括号/记忆' },
  { icon:'✍️', name:'Markdown 编辑器', desc:'实时分栏预览 · 代码高亮 · 导出' },
];

// ===== State =====
let currentUser = null;

// ===== Render Tools =====
function filterTools() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('toolsGrid');
  const noResult = document.getElementById('noResult');

  let filtered = tools;
  if (query) {
    filtered = filtered.filter(t =>
      t.name.toLowerCase().includes(query) ||
      t.desc.toLowerCase().includes(query)
    );
  }

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';
  grid.innerHTML = filtered.map((t, i) =>
    `<div class="tool-card" onclick="openTool('${t.name}')" style="animation: fadeIn .3s ease ${i * 0.03}s both">
      <div class="tool-icon">${t.icon}</div>
      <div class="tool-name">${t.name}</div>
      <div class="tool-desc">${t.desc}</div>
    </div>`
  ).join('');
}

function openTool(name) {
  if (!currentUser) {
    showToast('请先登录后使用工具');
    openModal();
    return;
  }
  showToast(`「${name}」功能开发中...`);
}

// ===== Login Modal =====
let authMode = 'login';

function openModal() {
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  document.getElementById('errorMsg').classList.remove('show');
}

function switchTab(mode) {
  authMode = mode;
  const loginTab = document.getElementById('loginTab');
  const registerTab = document.getElementById('registerTab');
  const modalTitle = document.getElementById('modalTitle');
  const modalSub = document.getElementById('modalSub');
  const submitBtn = document.getElementById('submitBtn');
  const footerText = document.getElementById('footerText');
  const footerLink = document.querySelector('.modal-footer a');
  const regFields = document.querySelectorAll('.register-fields');
  const formRow = document.getElementById('formRow');

  if (mode === 'login') {
    loginTab.classList.add('active');
    registerTab.classList.remove('active');
    modalTitle.textContent = '欢迎回来';
    modalSub.textContent = '登录以同步你的工具收藏';
    submitBtn.textContent = '登 录';
    footerText.textContent = '还没有账号？';
    footerLink.textContent = '立即注册';
    footerLink.onclick = () => switchTab('register');
    formRow.style.display = 'flex';
    regFields.forEach(f => f.classList.remove('show'));
  } else {
    registerTab.classList.add('active');
    loginTab.classList.remove('active');
    modalTitle.textContent = '创建账号';
    modalSub.textContent = '注册后可收藏常用工具';
    submitBtn.textContent = '注 册';
    footerText.textContent = '已有账号？';
    footerLink.textContent = '去登录';
    footerLink.onclick = () => switchTab('login');
    formRow.style.display = 'none';
    regFields.forEach(f => f.classList.add('show'));
  }
  document.getElementById('errorMsg').classList.remove('show');
}

function handleAuth(e) {
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;

  if (!email || !password) { showError('请填写完整信息'); return; }
  if (password.length < 6) { showError('密码至少 6 位'); return; }

  if (authMode === 'register') {
    const regName = document.getElementById('regName').value.trim();
    const regConfirm = document.getElementById('regConfirm').value;
    if (!regName) { showError('请输入用户名'); return; }
    if (password !== regConfirm) { showError('两次密码不一致'); return; }
    const users = JSON.parse(localStorage.getItem('toolbox_users') || '{}');
    if (users[email]) { showError('该邮箱已注册'); return; }
    users[email] = { name: regName, email, password };
    localStorage.setItem('toolbox_users', JSON.stringify(users));
    showToast('注册成功，已自动登录');
    loginUser(regName);
  } else {
    const users = JSON.parse(localStorage.getItem('toolbox_users') || '{}');
    const user = users[email] || users[email.toLowerCase()];
    if (!user || user.password !== password) {
      if (email === 'demo' && password === '123456') {
        showToast('登录成功');
        loginUser('体验用户');
      } else {
        showError('邮箱或密码错误（试试 demo / 123456）');
      }
    } else {
      showToast('登录成功');
      loginUser(user.name);
    }
  }
}

function loginUser(name) {
  currentUser = name;
  document.getElementById('loginBtn').style.display = 'none';
  const menu = document.getElementById('userMenu');
  menu.classList.add('show');
  document.getElementById('userName').textContent = name;
  document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
  localStorage.setItem('toolbox_user', name);
  closeModal();
  document.getElementById('authForm').reset();
}

function logout() {
  currentUser = null;
  document.getElementById('loginBtn').style.display = 'flex';
  document.getElementById('userMenu').classList.remove('show');
  localStorage.removeItem('toolbox_user');
  showToast('已退出登录');
}

function socialLogin(platform) {
  showToast(`正在通过 ${platform} 登录...`);
  setTimeout(() => loginUser(platform + '用户'), 800);
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

// ===== Theme =====
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('toolbox_theme', isDark ? 'light' : 'dark');
  const icon = document.getElementById('themeIcon');
  if (isDark) {
    icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  }
}

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ===== Init =====
function init() {
  const savedTheme = localStorage.getItem('toolbox_theme') || 'light';
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeIcon').innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  }
  const savedUser = localStorage.getItem('toolbox_user');
  if (savedUser) loginUser(savedUser);
  filterTools();
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

const style = document.createElement('style');
style.textContent = '@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }';
document.head.appendChild(style);

init();
</script>
</body>
</html>
