<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音视频工具箱 · 工具箱</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a class="back-btn" href="index.html" style="display:flex;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    返回首页
  </a>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    <span>工具箱</span>
  </div>
  <div class="header-actions" style="margin-left:auto;">
    <button class="icon-btn" onclick="toggleTheme()" title="切换主题"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
</header>

<div id="toolView" style="display:block;">
  <div class="tool-header">
    <div class="tool-header-row">
      <div class="tool-title"><div class="tool-title-icon">🎞️</div><span>音视频工具箱</span></div>
    </div>
  </div>
  <div class="tool-body">
    <div class="media-wrap">
      <div class="media-notice">
        <strong>原生方案说明</strong>
        <p>为保证在 GitHub Pages 等静态环境可运行，视频相关功能统一输出 <code>WebM</code>；音频剪切和音频转格式输出 <code>WAV</code>。老浏览器会自动检测并提示不可用能力。</p>
      </div>
      <div class="media-loader" id="mediaLoader">
        <div class="media-loader-head">
          <span id="mediaLoadText">正在检测浏览器能力...</span>
          <strong id="mediaLoadPercent">0%</strong>
        </div>
        <div class="media-progress"><div id="mediaProgressFill"></div></div>
      </div>
      <div class="media-form">
        <div class="form-group">
          <label>功能类型</label>
          <select id="mediaMode" class="translator-select" onchange="updateMediaMode()">
            <option value="cut-video">剪切视频</option>
            <option value="cut-audio">剪切音频</option>
            <option value="audio-convert">音频转 WAV</option>
            <option value="merge-av">视频音频合并</option>
          </select>
        </div>
        <div class="media-file-row">
          <label class="media-file-card">
            <span id="mediaMainLabel">选择视频文件</span>
            <input type="file" id="mediaMainFile" accept="video/*">
            <em id="mediaMainHint">支持浏览器可播放的视频，结果输出 WebM</em>
          </label>
          <label class="media-file-card" id="mediaAudioBox" style="display:none;">
            <span>选择音频文件</span>
            <input type="file" id="mediaAudioFile" accept="audio/*">
            <em>合并时会把该音频作为新音轨</em>
          </label>
        </div>
        <div class="media-time-row" id="mediaTimeRow">
          <div class="form-group">
            <label>开始时间</label>
            <input class="media-input" id="mediaStart" value="00:00:00" placeholder="00:00:00">
          </div>
          <div class="form-group">
            <label>结束时间</label>
            <input class="media-input" id="mediaEnd" placeholder="例如 00:00:10">
          </div>
        </div>
        <div class="form-group" id="mediaFormatBox" style="display:none;">
          <label>输出格式</label>
          <select id="mediaFormat" class="translator-select">
            <option value="wav">WAV</option>
          </select>
        </div>
        <div class="translator-actions">
          <button class="arrow-btn" onclick="runMediaTask()">开始处理</button>
          <button class="action-btn" onclick="resetMediaTool()">清空</button>
        </div>
        <div class="media-status" id="mediaStatus">正在检测浏览器能力，请稍候。</div>
        <div class="result-box" id="mediaResult">
          <div class="result-header">
            <span class="result-title">处理完成</span>
            <div class="result-actions">
              <a class="action-btn" id="mediaDownload" href="#" download>💾 下载结果</a>
            </div>
          </div>
        </div>
        <div class="media-status" id="mediaCompatStatus"></div>
      </div>
    </div>
  </div>
</div>

<footer class="footer"><p>工具箱 · 音视频工具箱 · 浏览器原生处理</p></footer>
<div class="toast" id="toast"></div>

<script src="js/native-media.js"></script>
</body>
</html>
